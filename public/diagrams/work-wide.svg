<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 556" role="img" aria-labelledby="work-w-title work-w-desc">
  <title id="work-w-title">The work, step by step</title>
  <desc id="work-w-desc">Level 1 is three steps: register a Redbelly node, pass the health check and give every sending address Redbelly access. Level 3 is five steps that depend on Quant, and none have been announced.</desc>
  <rect x="20" y="16" width="920" height="259" rx="6" fill="#0c1317" stroke="#223039" stroke-width="1.5"/>
  <rect x="48" y="58" width="18" height="4" rx="2" fill="#8fa1ad"/>
  <text x="76" y="66" font-family="Be Vietnam Pro, sans-serif" font-size="20" font-weight="700" fill="#f1f5f8">Level 1</text>
  <rect x="164" y="46" width="289" height="28" rx="14" fill="#17222a" stroke="#263641" stroke-width="1.5"/>
  <text x="178" y="65.4" font-family="JetBrains Mono, monospace" font-size="15" font-weight="500" fill="#c2ced6">small, any Overledger account</text>
  <line x1="66.0" y1="118" x2="642.0" y2="118" stroke="#263641" stroke-width="3" stroke-linecap="round"/>
  <circle cx="66.0" cy="118" r="18" fill="#263641" stroke="#8fa1ad" stroke-width="1.5"/>
  <text x="66.0" y="123.4" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="15" font-weight="500" fill="#f1f5f8">1</text>
  <text x="48.0" y="170" font-family="Be Vietnam Pro, sans-serif" font-size="18" font-weight="600" fill="#f1f5f8"><tspan x="48.0">Register a</tspan><tspan x="48.0" dy="24">Redbelly node</tspan></text>
  <text x="48.0" y="224" font-family="Be Vietnam Pro, sans-serif" font-size="15" font-weight="400" fill="#c2ced6"><tspan x="48.0">official RPC as private, or an</tspan><tspan x="48.0" dy="21">approved provider as public</tspan></text>
  <circle cx="354.0" cy="118" r="18" fill="#263641" stroke="#8fa1ad" stroke-width="1.5"/>
  <text x="354.0" y="123.4" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="15" font-weight="500" fill="#f1f5f8">2</text>
  <text x="336.0" y="170" font-family="Be Vietnam Pro, sans-serif" font-size="18" font-weight="600" fill="#f1f5f8"><tspan x="336.0">Pass the</tspan><tspan x="336.0" dy="24">health check</tspan></text>
  <text x="336.0" y="224" font-family="Be Vietnam Pro, sans-serif" font-size="15" font-weight="400" fill="#c2ced6"><tspan x="336.0">if it fails, the node</tspan><tspan x="336.0" dy="21">is not added</tspan></text>
  <circle cx="642.0" cy="118" r="18" fill="#263641" stroke="#8fa1ad" stroke-width="1.5"/>
  <text x="642.0" y="123.4" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="15" font-weight="500" fill="#f1f5f8">3</text>
  <text x="624.0" y="170" font-family="Be Vietnam Pro, sans-serif" font-size="18" font-weight="600" fill="#f1f5f8"><tspan x="624.0">Give every sending</tspan><tspan x="624.0" dy="24">address Redbelly access</tspan></text>
  <text x="624.0" y="224" font-family="Be Vietnam Pro, sans-serif" font-size="15" font-weight="400" fill="#c2ced6"><tspan x="624.0">institutions can keep their</tspan><tspan x="624.0" dy="21">own keys</tspan></text>
  <rect x="20" y="291" width="920" height="249" rx="6" fill="#0c1317" stroke="#223039" stroke-width="1.5"/>
  <rect x="48" y="333" width="18" height="4" rx="2" fill="#8fa1ad"/>
  <text x="76" y="341" font-family="Be Vietnam Pro, sans-serif" font-size="20" font-weight="700" fill="#f1f5f8">Level 3</text>
  <rect x="164" y="321" width="316" height="28" rx="14" fill="none" stroke="#EF5350" stroke-width="1.5"/>
  <text x="178" y="340.4" font-family="JetBrains Mono, monospace" font-size="15" font-weight="500" fill="#ffb3ae">depends on Quant, none announced</text>
  <line x1="66.0" y1="393" x2="757.2" y2="393" stroke="#263641" stroke-width="3" stroke-dasharray="8 6"/>
  <circle cx="66.0" cy="393" r="18" fill="#EF5350"/>
  <text x="66.0" y="398.4" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="15" font-weight="500" fill="#ffffff">1</text>
  <text x="48.0" y="443" font-family="Be Vietnam Pro, sans-serif" font-size="16" font-weight="600" fill="#f1f5f8"><tspan x="48.0">Deploy the rollup's</tspan><tspan x="48.0" dy="22">bridge and dispute</tspan><tspan x="48.0" dy="22">contracts on</tspan><tspan x="48.0" dy="22">Redbelly</tspan></text>
  <circle cx="238.8" cy="393" r="18" fill="#EF5350"/>
  <text x="238.8" y="398.4" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="15" font-weight="500" fill="#ffffff">2</text>
  <text x="220.8" y="443" font-family="Be Vietnam Pro, sans-serif" font-size="16" font-weight="600" fill="#f1f5f8"><tspan x="220.8">Post rollup state</tspan><tspan x="220.8" dy="22">roots to Redbelly</tspan></text>
  <circle cx="411.6" cy="393" r="18" fill="#EF5350"/>
  <text x="411.6" y="398.4" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="15" font-weight="500" fill="#ffffff">3</text>
  <text x="393.6" y="443" font-family="Be Vietnam Pro, sans-serif" font-size="16" font-weight="600" fill="#f1f5f8"><tspan x="393.6">Add each token</tspan><tspan x="393.6" dy="22">through Quant</tspan><tspan x="393.6" dy="22">governance</tspan></text>
  <circle cx="584.4" cy="393" r="18" fill="#EF5350"/>
  <text x="584.4" y="398.4" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="15" font-weight="500" fill="#ffffff">4</text>
  <text x="566.4" y="443" font-family="Be Vietnam Pro, sans-serif" font-size="16" font-weight="600" fill="#f1f5f8"><tspan x="566.4">Issuers decide</tspan><tspan x="566.4" dy="22">if the bridge</tspan><tspan x="566.4" dy="22">contract may</tspan><tspan x="566.4" dy="22">hold their tokens</tspan></text>
  <circle cx="757.2" cy="393" r="18" fill="#EF5350"/>
  <text x="757.2" y="398.4" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="15" font-weight="500" fill="#ffffff">5</text>
  <text x="739.2" y="443" font-family="Be Vietnam Pro, sans-serif" font-size="16" font-weight="600" fill="#f1f5f8"><tspan x="739.2">Keep Overledger</tspan><tspan x="739.2" dy="22">allowlists in step</tspan><tspan x="739.2" dy="22">with Receptor</tspan></text>
</svg>
