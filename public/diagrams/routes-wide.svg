<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 884" role="img" aria-labelledby="routes-w-title routes-w-desc">
  <title id="routes-w-title">Two ways a chain reaches Overledger</title>
  <desc id="routes-w-desc">Two columns compare the self-serve route, where a chain in one of six supported families registers a public or private node, passes a health check and becomes reachable through the Gateway, with the managed engagement route for permissioned networks and brand-new chain families.</desc>
  <defs>
    <marker id="routes-w-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0.5 L10 5 L0 9.5 Z" fill="#8fa1ad"/>
    </marker>
  </defs>

  <!-- column headings -->
  <rect x="10" y="21" width="18" height="4" rx="2" fill="#EF5350"/>
  <text x="46" y="30" font-family="Be Vietnam Pro, sans-serif" font-size="20" font-weight="700" fill="#ffb3ae">Self-serve</text>
  <line x1="6" y1="46" x2="590" y2="46" stroke="#223039" stroke-width="1.5"/>
  <rect x="629" y="21" width="18" height="4" rx="2" fill="#8fa1ad"/>
  <text x="664" y="30" font-family="Be Vietnam Pro, sans-serif" font-size="20" font-weight="700" fill="#f1f5f8">Managed engagement</text>
  <line x1="625" y1="46" x2="954" y2="46" stroke="#223039" stroke-width="1.5"/>
  <line x1="609" y1="68" x2="609" y2="878" stroke="#223039" stroke-width="1.5"/>

  <!-- self-serve step rail -->
  <line x1="19" y1="114" x2="19" y2="654" stroke="#223039" stroke-width="1.5"/>

  <!-- step 1: chain family -->
  <rect x="46" y="68" width="544" height="92" rx="6" fill="#17222a" stroke="#263641" stroke-width="1.5"/>
  <text x="64" y="99" font-family="Be Vietnam Pro, sans-serif" font-size="18" font-weight="600" fill="#f1f5f8">Chain family is</text>
  <rect x="64" y="114" width="49.09" height="28" rx="4" fill="#0c1317" stroke="#263641" stroke-width="1"/>
  <text x="88.55" y="133.25" font-family="JetBrains Mono, monospace" font-size="15" font-weight="500" fill="#f1f5f8" text-anchor="middle">EVM</text>
  <rect x="121.09" y="114" width="76.18" height="28" rx="4" fill="#0c1317" stroke="#263641" stroke-width="1"/>
  <text x="159.18" y="133.25" font-family="JetBrains Mono, monospace" font-size="15" font-weight="500" fill="#f1f5f8" text-anchor="middle">Solana</text>
  <rect x="205.27" y="114" width="76.18" height="28" rx="4" fill="#0c1317" stroke="#263641" stroke-width="1"/>
  <text x="243.36" y="133.25" font-family="JetBrains Mono, monospace" font-size="15" font-weight="500" fill="#f1f5f8" text-anchor="middle">Cosmos</text>
  <rect x="289.45" y="114" width="49.09" height="28" rx="4" fill="#0c1317" stroke="#263641" stroke-width="1"/>
  <text x="314.0" y="133.25" font-family="JetBrains Mono, monospace" font-size="15" font-weight="500" fill="#f1f5f8" text-anchor="middle">SUI</text>
  <rect x="346.54" y="114" width="76.18" height="28" rx="4" fill="#0c1317" stroke="#263641" stroke-width="1"/>
  <text x="384.63" y="133.25" font-family="JetBrains Mono, monospace" font-size="15" font-weight="500" fill="#f1f5f8" text-anchor="middle">Hedera</text>
  <rect x="430.72" y="114" width="67.15" height="28" rx="4" fill="#0c1317" stroke="#263641" stroke-width="1"/>
  <text x="464.29" y="133.25" font-family="JetBrains Mono, monospace" font-size="15" font-weight="500" fill="#f1f5f8" text-anchor="middle">Aptos</text>
  <path d="M318 160 V192" fill="none" stroke="#8fa1ad" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#routes-w-arrow)"/>

  <!-- step 2: register a node -->
  <rect x="46" y="192" width="544" height="76" rx="6" fill="#17222a" stroke="#263641" stroke-width="1.5"/>
  <text x="64" y="223" font-family="Be Vietnam Pro, sans-serif" font-size="18" font-weight="600" fill="#f1f5f8">Register a node</text>
  <text x="64" y="247" font-family="Be Vietnam Pro, sans-serif" font-size="15" font-weight="400" fill="#c2ced6">one API call or one form</text>

  <!-- fork into public or private node -->
  <path d="M318 268 V282 Q318 288 312 288 H227 Q221 288 221 294 V312" fill="none" stroke="#8fa1ad" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#routes-w-arrow)"/>
  <path d="M318 282 Q318 288 324 288 H495 Q501 288 501 294 V312" fill="none" stroke="#8fa1ad" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#routes-w-arrow)"/>

  <!-- approved providers, under the public node -->
  <rect x="54" y="400" width="334" height="92" rx="6" fill="#0c1317" stroke="#223039" stroke-width="1.5"/>
  <text x="68" y="434" font-family="JetBrains Mono, monospace" font-size="15" font-weight="400" fill="#8fa1ad">
    <tspan x="68" dy="0">alchemy.com infura.io quiknode.pro</tspan>
    <tspan x="68" dy="20">chainstack.com getblock.io</tspan>
    <tspan x="68" dy="20">blockdaemon.com ankr.com</tspan>
  </text>

  <!-- step 3: public node -->
  <rect x="46" y="312" width="350" height="96" rx="6" fill="#17222a" stroke="#263641" stroke-width="1.5"/>
  <text x="64" y="343" font-family="Be Vietnam Pro, sans-serif" font-size="18" font-weight="600" fill="#f1f5f8">Public node</text>
  <text x="64" y="367" font-family="Be Vietnam Pro, sans-serif" font-size="15" font-weight="400" fill="#c2ced6">
    <tspan x="64" dy="0">approved provider, API key in the URL,</tspan>
    <tspan x="64" dy="21">in a shared pool</tspan>
  </text>

  <!-- step 3: private node -->
  <rect x="412" y="312" width="178" height="96" rx="6" fill="#17222a" stroke="#263641" stroke-width="1.5"/>
  <text x="428" y="343" font-family="Be Vietnam Pro, sans-serif" font-size="18" font-weight="600" fill="#f1f5f8">Private node</text>
  <text x="428" y="367" font-family="Be Vietnam Pro, sans-serif" font-size="15" font-weight="400" fill="#c2ced6">
    <tspan x="428" dy="0">any HTTPS address,</tspan>
    <tspan x="428" dy="21">only you can use it</tspan>
  </text>

  <!-- merge into health check -->
  <path d="M221 492 V504 Q221 510 227 510 H312 Q318 510 318 516 V538" fill="none" stroke="#8fa1ad" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#routes-w-arrow)"/>
  <path d="M501 408 V504 Q501 510 495 510 H324 Q318 510 318 516" fill="none" stroke="#8fa1ad" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- step 4: health check -->
  <rect x="46" y="538" width="544" height="56" rx="6" fill="#17222a" stroke="#263641" stroke-width="1.5"/>
  <text x="64" y="572" font-family="Be Vietnam Pro, sans-serif" font-size="18" font-weight="600" fill="#f1f5f8">Health check</text>
  <path d="M318 594 V626" fill="none" stroke="#8fa1ad" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#routes-w-arrow)"/>

  <!-- step 5: reachable through the Gateway -->
  <rect x="46" y="626" width="544" height="56" rx="6" fill="#1d3140" stroke="#EF5350" stroke-width="2"/>
  <text x="64" y="660" font-family="Be Vietnam Pro, sans-serif" font-size="18" font-weight="600" fill="#ffb3ae">Reachable through the Gateway</text>
  <circle cx="19" cy="114" r="13" fill="#0c1317" stroke="#EF5350" stroke-width="1.5"/>
  <text x="19" y="119.25" font-family="JetBrains Mono, monospace" font-size="15" font-weight="500" fill="#ffb3ae" text-anchor="middle">1</text>
  <circle cx="19" cy="230" r="13" fill="#0c1317" stroke="#EF5350" stroke-width="1.5"/>
  <text x="19" y="235.25" font-family="JetBrains Mono, monospace" font-size="15" font-weight="500" fill="#ffb3ae" text-anchor="middle">2</text>
  <circle cx="19" cy="360" r="13" fill="#0c1317" stroke="#EF5350" stroke-width="1.5"/>
  <text x="19" y="365.25" font-family="JetBrains Mono, monospace" font-size="15" font-weight="500" fill="#ffb3ae" text-anchor="middle">3</text>
  <circle cx="19" cy="566" r="13" fill="#0c1317" stroke="#EF5350" stroke-width="1.5"/>
  <text x="19" y="571.25" font-family="JetBrains Mono, monospace" font-size="15" font-weight="500" fill="#ffb3ae" text-anchor="middle">4</text>
  <circle cx="19" cy="654" r="13" fill="#0c1317" stroke="#EF5350" stroke-width="1.5"/>
  <text x="19" y="659.25" font-family="JetBrains Mono, monospace" font-size="15" font-weight="500" fill="#ffb3ae" text-anchor="middle">5</text>

  <!-- panel: the self-serve test -->
  <rect x="6" y="718" width="584" height="160" rx="6" fill="#141f26" stroke="#223039" stroke-width="1.5"/>
  <rect x="24" y="746.6" width="18" height="4" rx="2" fill="#EF5350"/>
  <text x="58" y="754" font-family="JetBrains Mono, monospace" font-size="15" font-weight="500" fill="#8fa1ad" letter-spacing="1.5">THE SELF-SERVE TEST</text>
  <circle cx="35" cy="790" r="11" fill="#0c1317" stroke="#86EFAC" stroke-width="1.5"/>
  <path d="M30.4 790.2 L33.6 793.4 L39.8 786.6" fill="none" stroke="#86EFAC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="58" y="795.5" font-family="Be Vietnam Pro, sans-serif" font-size="16" font-weight="400" fill="#f1f5f8">Nodes answer over HTTPS</text>
  <circle cx="35" cy="824" r="11" fill="#0c1317" stroke="#86EFAC" stroke-width="1.5"/>
  <path d="M30.4 824.2 L33.6 827.4 L39.8 820.6" fill="none" stroke="#86EFAC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="58" y="829.5" font-family="Be Vietnam Pro, sans-serif" font-size="16" font-weight="400" fill="#f1f5f8">Nothing needed beyond an API key</text>
  <circle cx="35" cy="858" r="11" fill="#0c1317" stroke="#86EFAC" stroke-width="1.5"/>
  <path d="M30.4 858.2 L33.6 861.4 L39.8 854.6" fill="none" stroke="#86EFAC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="58" y="863.5" font-family="Be Vietnam Pro, sans-serif" font-size="16" font-weight="400" fill="#f1f5f8">It does not matter which node you use</text>

  <!-- managed engagement step rail -->
  <line x1="638" y1="110" x2="638" y2="354" stroke="#223039" stroke-width="1.5"/>

  <!-- managed step 1 -->
  <rect x="664" y="68" width="290" height="84" rx="6" fill="#17222a" stroke="#263641" stroke-width="1.5"/>
  <text x="682" y="104" font-family="Be Vietnam Pro, sans-serif" font-size="18" font-weight="600" fill="#f1f5f8">
    <tspan x="682" dy="0">Permissioned, consortium or</tspan>
    <tspan x="682" dy="24">operator-gated networks</tspan>
  </text>
  <path d="M809 152 V192" fill="none" stroke="#8fa1ad" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#routes-w-arrow)"/>

  <!-- managed step 2 -->
  <rect x="664" y="192" width="290" height="84" rx="6" fill="#17222a" stroke="#263641" stroke-width="1.5"/>
  <text x="682" y="228" font-family="Be Vietnam Pro, sans-serif" font-size="18" font-weight="600" fill="#f1f5f8">
    <tspan x="682" dy="0">Project engagement</tspan>
    <tspan x="682" dy="24">with Quant</tspan>
  </text>
  <path d="M809 276 V312" fill="none" stroke="#8fa1ad" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#routes-w-arrow)"/>

  <!-- managed step 3 -->
  <rect x="664" y="312" width="290" height="84" rx="6" fill="#17222a" stroke="#263641" stroke-width="1.5"/>
  <text x="682" y="348" font-family="Be Vietnam Pro, sans-serif" font-size="18" font-weight="600" fill="#f1f5f8">
    <tspan x="682" dy="0">Connector set up with the</tspan>
    <tspan x="682" dy="24">network's own configuration</tspan>
  </text>
  <circle cx="638" cy="110" r="13" fill="#0c1317" stroke="#8fa1ad" stroke-width="1.5"/>
  <text x="638" y="115.25" font-family="JetBrains Mono, monospace" font-size="15" font-weight="500" fill="#c2ced6" text-anchor="middle">1</text>
  <circle cx="638" cy="234" r="13" fill="#0c1317" stroke="#8fa1ad" stroke-width="1.5"/>
  <text x="638" y="239.25" font-family="JetBrains Mono, monospace" font-size="15" font-weight="500" fill="#c2ced6" text-anchor="middle">2</text>
  <circle cx="638" cy="354" r="13" fill="#0c1317" stroke="#8fa1ad" stroke-width="1.5"/>
  <text x="638" y="359.25" font-family="JetBrains Mono, monospace" font-size="15" font-weight="500" fill="#c2ced6" text-anchor="middle">3</text>

  <!-- panel: brand-new chain family -->
  <rect x="625" y="458" width="329" height="224" rx="6" fill="#141f26" stroke="#223039" stroke-width="1.5"/>
  <rect x="643" y="486.6" width="18" height="4" rx="2" fill="#EF5350"/>
  <text x="677" y="494" font-family="JetBrains Mono, monospace" font-size="15" font-weight="500" fill="#8fa1ad" letter-spacing="1.5">BRAND-NEW CHAIN FAMILY</text>
  <text x="643" y="532" font-family="Be Vietnam Pro, sans-serif" font-size="16" font-weight="400" fill="#f1f5f8">Health and chain identity checker</text>
  <rect x="643" y="544" width="130.36" height="28" rx="4" fill="#0c1317" stroke="#263641" stroke-width="1"/>
  <text x="708.18" y="563.25" font-family="JetBrains Mono, monospace" font-size="15" font-weight="500" fill="#ffb3ae" text-anchor="middle">about 2 days</text>
  <line x1="643" y1="592" x2="936" y2="592" stroke="#223039" stroke-width="1.5"/>
  <text x="643" y="618" font-family="Be Vietnam Pro, sans-serif" font-size="16" font-weight="400" fill="#f1f5f8">Each app that uses it</text>
  <rect x="643" y="630" width="193.57" height="28" rx="4" fill="#0c1317" stroke="#263641" stroke-width="1"/>
  <text x="739.78" y="649.25" font-family="JetBrains Mono, monospace" font-size="15" font-weight="500" fill="#ffb3ae" text-anchor="middle">about 1 day per app</text>
</svg>
