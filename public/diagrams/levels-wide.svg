<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 786" role="img" aria-labelledby="levels-w-title levels-w-desc">
<title id="levels-w-title">Three meanings of 'connect', three answers</title>
<desc id="levels-w-desc">Three stacked cards show, for each meaning of connect, what is in place and what is missing or open. Level 1, Gateway access, is possibly, untested; Level 2, Flow Apps, is unknown; Level 3, Fusion Rollup, is not possible yet.</desc>
<rect x="16" y="8" width="928" height="280" rx="6" fill="#0c1317" stroke="#223039" stroke-width="1.5"/>
<text x="36" y="70" font-family="JetBrains Mono, monospace" font-size="52" font-weight="500" fill="#ffb3ae">1</text>
<text x="82" y="43" font-family="JetBrains Mono, monospace" font-size="15" font-weight="500" fill="#8fa1ad" letter-spacing="1.5">LEVEL</text>
<text x="82" y="70" font-family="Be Vietnam Pro, sans-serif" font-size="20" font-weight="700" fill="#f1f5f8">Gateway access</text>
<text font-family="Be Vietnam Pro, sans-serif" font-size="15" font-weight="400" fill="#c2ced6"><tspan x="38" y="104">read data, send self-signed</tspan><tspan x="38" dy="21">transactions</tspan></text>
<circle cx="42.5" cy="158.0" r="4" fill="#FCD34D"/>
<text x="53" y="163.4" font-family="JetBrains Mono, monospace" font-size="15" font-weight="500" fill="#FCD34D" letter-spacing="1.2">POSSIBLY, UNTESTED</text>
<rect x="280" y="30" width="642" height="236" rx="6" fill="#17222a" stroke="#263641" stroke-width="1.5"/>
<line x1="557" y1="48" x2="557" y2="248" stroke="#263641" stroke-width="1.5"/>
<text x="300" y="62" font-family="JetBrains Mono, monospace" font-size="15" font-weight="500" fill="#8fa1ad" letter-spacing="1.5">IN PLACE</text>
<line x1="300" y1="76" x2="545" y2="76" stroke="#263641" stroke-width="1"/>
<path d="M303 101.5 l3.5 3.5 l7 -7.5" fill="none" stroke="#86EFAC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text font-family="Be Vietnam Pro, sans-serif" font-size="15" font-weight="400" fill="#f1f5f8"><tspan x="326" y="106">Redbelly is EVM compatible</tspan></text>
<path d="M303 135.5 l3.5 3.5 l7 -7.5" fill="none" stroke="#86EFAC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text font-family="Be Vietnam Pro, sans-serif" font-size="15" font-weight="400" fill="#f1f5f8"><tspan x="326" y="140">Ankr, an approved provider,</tspan><tspan x="326" dy="21">runs a Redbelly RPC</tspan></text>
<path d="M303 190.5 l3.5 3.5 l7 -7.5" fill="none" stroke="#86EFAC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text font-family="Be Vietnam Pro, sans-serif" font-size="15" font-weight="400" fill="#f1f5f8"><tspan x="326" y="195">RPC answers chain ID <tspan font-family="JetBrains Mono, monospace" font-weight="500">151</tspan></tspan></text>
<text x="569" y="62" font-family="JetBrains Mono, monospace" font-size="15" font-weight="500" fill="#8fa1ad" letter-spacing="1.5">MISSING OR OPEN</text>
<line x1="569" y1="76" x2="902" y2="76" stroke="#263641" stroke-width="1"/>
<circle cx="577" cy="101" r="4.5" fill="none" stroke="#8fa1ad" stroke-width="1.5"/>
<text font-family="Be Vietnam Pro, sans-serif" font-size="15" font-weight="400" fill="#f1f5f8"><tspan x="595" y="106">Self-serve status not confirmed</tspan></text>
<circle cx="577" cy="135" r="4.5" fill="none" stroke="#8fa1ad" stroke-width="1.5"/>
<text font-family="Be Vietnam Pro, sans-serif" font-size="15" font-weight="400" fill="#f1f5f8"><tspan x="595" y="140">Health check method not documented</tspan></text>
<circle cx="577" cy="169" r="4.5" fill="none" stroke="#8fa1ad" stroke-width="1.5"/>
<text font-family="Be Vietnam Pro, sans-serif" font-size="15" font-weight="400" fill="#f1f5f8"><tspan x="595" y="174"><tspan font-family="JetBrains Mono, monospace" font-weight="500">net_version</tspan> not supported on Redbelly</tspan></text>
<circle cx="577" cy="203" r="4.5" fill="none" stroke="#8fa1ad" stroke-width="1.5"/>
<text font-family="Be Vietnam Pro, sans-serif" font-size="15" font-weight="400" fill="#f1f5f8"><tspan x="595" y="208">Keyed Ankr endpoint not confirmed</tspan></text>
<circle cx="577" cy="237" r="4.5" fill="none" stroke="#8fa1ad" stroke-width="1.5"/>
<text font-family="Be Vietnam Pro, sans-serif" font-size="15" font-weight="400" fill="#f1f5f8"><tspan x="595" y="242">Live network lists need an API key</tspan></text>
<g transform="translate(0 34)">
<rect x="16" y="268" width="928" height="195" rx="6" fill="#0c1317" stroke="#223039" stroke-width="1.5"/>
<text x="36" y="330" font-family="JetBrains Mono, monospace" font-size="52" font-weight="500" fill="#ffb3ae">2</text>
<text x="82" y="303" font-family="JetBrains Mono, monospace" font-size="15" font-weight="500" fill="#8fa1ad" letter-spacing="1.5">LEVEL</text>
<text x="82" y="330" font-family="Be Vietnam Pro, sans-serif" font-size="20" font-weight="700" fill="#f1f5f8">Flow Apps</text>
<text font-family="Be Vietnam Pro, sans-serif" font-size="15" font-weight="400" fill="#c2ced6"><tspan x="38" y="364">Quant workflows</tspan><tspan x="38" dy="21">such as signing</tspan></text>
<circle cx="42.5" cy="418.0" r="4" fill="#EF5350"/>
<text x="53" y="423.4" font-family="JetBrains Mono, monospace" font-size="15" font-weight="500" fill="#ffb3ae" letter-spacing="1.2">UNKNOWN</text>
<rect x="280" y="290" width="642" height="151" rx="6" fill="#17222a" stroke="#263641" stroke-width="1.5"/>
<text x="300" y="322" font-family="JetBrains Mono, monospace" font-size="15" font-weight="500" fill="#8fa1ad" letter-spacing="1.5">OPEN</text>
<line x1="300" y1="336" x2="902" y2="336" stroke="#263641" stroke-width="1"/>
<circle cx="308" cy="361" r="4.5" fill="none" stroke="#8fa1ad" stroke-width="1.5"/>
<text font-family="Be Vietnam Pro, sans-serif" font-size="15" font-weight="400" fill="#f1f5f8"><tspan x="326" y="366">App catalogue not published</tspan></text>
<circle cx="308" cy="395" r="4.5" fill="none" stroke="#8fa1ad" stroke-width="1.5"/>
<text font-family="Be Vietnam Pro, sans-serif" font-size="15" font-weight="400" fill="#f1f5f8"><tspan x="326" y="400">Every shipped app is built by Quant</tspan></text>
<rect x="16" y="477" width="928" height="267" rx="6" fill="#0c1317" stroke="#223039" stroke-width="1.5"/>
<text x="36" y="539" font-family="JetBrains Mono, monospace" font-size="52" font-weight="500" fill="#ffb3ae">3</text>
<text x="82" y="512" font-family="JetBrains Mono, monospace" font-size="15" font-weight="500" fill="#8fa1ad" letter-spacing="1.5">LEVEL</text>
<text x="82" y="539" font-family="Be Vietnam Pro, sans-serif" font-size="20" font-weight="700" fill="#f1f5f8">Fusion Rollup</text>
<text font-family="Be Vietnam Pro, sans-serif" font-size="15" font-weight="400" fill="#c2ced6"><tspan x="38" y="573">deposits, unified balances,</tspan><tspan x="38" dy="21">cross-chain messages</tspan></text>
<circle cx="42.5" cy="627.0" r="4" fill="#EF5350"/>
<text x="53" y="632.4" font-family="JetBrains Mono, monospace" font-size="15" font-weight="500" fill="#ffb3ae" letter-spacing="1.2">NOT POSSIBLE YET</text>
<rect x="280" y="499" width="642" height="223" rx="6" fill="#17222a" stroke="#263641" stroke-width="1.5"/>
<line x1="557" y1="517" x2="557" y2="704" stroke="#263641" stroke-width="1.5"/>
<text x="300" y="531" font-family="JetBrains Mono, monospace" font-size="15" font-weight="500" fill="#8fa1ad" letter-spacing="1.5">IN PLACE</text>
<line x1="300" y1="545" x2="545" y2="545" stroke="#263641" stroke-width="1"/>
<line x1="303" y1="570" x2="313" y2="570" stroke="#8fa1ad" stroke-width="2" stroke-linecap="round"/>
<text font-family="Be Vietnam Pro, sans-serif" font-size="15" font-weight="400" fill="#f1f5f8"><tspan x="326" y="575">Nothing documented</tspan><tspan x="326" dy="21">for Redbelly</tspan></text>
<text x="569" y="531" font-family="JetBrains Mono, monospace" font-size="15" font-weight="500" fill="#8fa1ad" letter-spacing="1.5">MISSING</text>
<line x1="569" y1="545" x2="902" y2="545" stroke="#263641" stroke-width="1"/>
<path d="M572.75 565.75 L581.25 574.25 M581.25 565.75 L572.75 574.25" fill="none" stroke="#EF5350" stroke-width="1.75" stroke-linecap="round"/>
<text font-family="Be Vietnam Pro, sans-serif" font-size="15" font-weight="400" fill="#f1f5f8"><tspan x="595" y="575">Not in the documented list</tspan></text>
<path d="M572.75 599.75 L581.25 608.25 M581.25 599.75 L572.75 608.25" fill="none" stroke="#EF5350" stroke-width="1.75" stroke-linecap="round"/>
<text font-family="Be Vietnam Pro, sans-serif" font-size="15" font-weight="400" fill="#f1f5f8"><tspan x="595" y="609">Bridge and dispute contracts on Redbelly</tspan></text>
<path d="M572.75 633.75 L581.25 642.25 M581.25 633.75 L572.75 642.25" fill="none" stroke="#EF5350" stroke-width="1.75" stroke-linecap="round"/>
<text font-family="Be Vietnam Pro, sans-serif" font-size="15" font-weight="400" fill="#f1f5f8"><tspan x="595" y="643">Rollup state roots posted to Redbelly</tspan><tspan x="595" dy="21">from accounts with Redbelly access</tspan></text>
<path d="M572.75 688.75 L581.25 697.25 M581.25 688.75 L572.75 697.25" fill="none" stroke="#EF5350" stroke-width="1.75" stroke-linecap="round"/>
<text font-family="Be Vietnam Pro, sans-serif" font-size="15" font-weight="400" fill="#f1f5f8"><tspan x="595" y="698">Each token added by Quant governance</tspan></text>
</g>
</svg>
