<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 708" role="img" aria-labelledby="stack-w-title stack-w-desc">
  <title id="stack-w-title">Overledger in one picture</title>
  <desc id="stack-w-desc">An institution or app uses one login and one interface to reach the Overledger Gateway, which holds Connectors, Flow Apps and a Firewall, and Connectors reach the self-serve families and permissioned networks. The Gateway is also the way in to the Fusion Rollup, a separate layer connected at testnet launch to Ethereum Sepolia, Polygon Amoy and the Quant permissioned Besu testnet, while Redbelly is not in that documented launch list.</desc>
  <defs>
    <marker id="stack-w-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8fa1ad"/>
    </marker>
  </defs>

  <!-- Institution or app -->
  <rect x="300" y="16" width="360" height="76" rx="6" fill="#17222a" stroke="#263641" stroke-width="1.5"/>
  <text x="480" y="49" text-anchor="middle" font-family="Be Vietnam Pro, sans-serif" font-size="19" font-weight="700" fill="#f1f5f8">Institution or app</text>
  <text x="480" y="74" text-anchor="middle" font-family="Be Vietnam Pro, sans-serif" font-size="15" fill="#c2ced6">uses one login and one interface</text>

  <circle cx="480" cy="92" r="3" fill="#8fa1ad"/>
  <line x1="480" y1="92" x2="480" y2="131" stroke="#8fa1ad" stroke-width="1.5" marker-end="url(#stack-w-arrow)"/>

  <!-- Overledger Gateway -->
  <rect x="20" y="134" width="920" height="182" rx="6" fill="#1d3140" stroke="#EF5350" stroke-width="2"/>
  <text x="44" y="172" font-family="Be Vietnam Pro, sans-serif" font-size="20" font-weight="700" fill="#ffb3ae">Overledger Gateway</text>

  <rect x="44" y="194" width="276" height="98" rx="6" fill="#17222a" stroke="#263641" stroke-width="1.5"/>
  <text x="64" y="230" font-family="Be Vietnam Pro, sans-serif" font-size="18" font-weight="600" fill="#f1f5f8">Connectors</text>
  <text font-family="Be Vietnam Pro, sans-serif" font-size="15" fill="#c2ced6"><tspan x="64" y="256">one interface to each</tspan><tspan x="64" dy="20">chain family</tspan></text>

  <rect x="342" y="194" width="276" height="98" rx="6" fill="#17222a" stroke="#263641" stroke-width="1.5"/>
  <text x="362" y="230" font-family="Be Vietnam Pro, sans-serif" font-size="18" font-weight="600" fill="#f1f5f8">Flow Apps</text>
  <text x="362" y="256" font-family="Be Vietnam Pro, sans-serif" font-size="15" fill="#c2ced6">multi-step workflows</text>

  <rect x="640" y="194" width="276" height="98" rx="6" fill="#17222a" stroke="#263641" stroke-width="1.5"/>
  <text x="660" y="230" font-family="Be Vietnam Pro, sans-serif" font-size="18" font-weight="600" fill="#f1f5f8">Firewall</text>
  <text x="660" y="256" font-family="Be Vietnam Pro, sans-serif" font-size="15" fill="#c2ced6">who may do what</text>

  <circle cx="182" cy="292" r="3" fill="#8fa1ad"/>
  <line x1="182" y1="292" x2="182" y2="341" stroke="#8fa1ad" stroke-width="1.5" marker-end="url(#stack-w-arrow)"/>

  <!-- Reached through Connectors -->
  <rect x="20" y="344" width="516" height="348" rx="6" fill="#0c1317" stroke="#223039" stroke-width="1.5"/>
  <rect x="44" y="372" width="18" height="4" rx="2" fill="#EF5350"/>
  <text x="70" y="380" font-family="JetBrains Mono, monospace" font-size="15" font-weight="500" letter-spacing="1.5" fill="#8fa1ad">REACHED THROUGH CONNECTORS</text>
  <text x="44" y="418" font-family="Be Vietnam Pro, sans-serif" font-size="15" font-weight="600" fill="#c2ced6">Self-serve families</text>
  <rect x="44" y="436" width="148" height="46" rx="6" fill="#17222a" stroke="#263641" stroke-width="1.5"/>
  <text x="118" y="464.5" text-anchor="middle" font-family="Be Vietnam Pro, sans-serif" font-size="15" font-weight="500" fill="#f1f5f8">EVM chains</text>
  <rect x="204" y="436" width="148" height="46" rx="6" fill="#17222a" stroke="#263641" stroke-width="1.5"/>
  <text x="278" y="464.5" text-anchor="middle" font-family="Be Vietnam Pro, sans-serif" font-size="15" font-weight="500" fill="#f1f5f8">Solana</text>
  <rect x="364" y="436" width="148" height="46" rx="6" fill="#17222a" stroke="#263641" stroke-width="1.5"/>
  <text x="438" y="464.5" text-anchor="middle" font-family="Be Vietnam Pro, sans-serif" font-size="15" font-weight="500" fill="#f1f5f8">Cosmos</text>
  <rect x="44" y="494" width="148" height="46" rx="6" fill="#17222a" stroke="#263641" stroke-width="1.5"/>
  <text x="118" y="522.5" text-anchor="middle" font-family="Be Vietnam Pro, sans-serif" font-size="15" font-weight="500" fill="#f1f5f8">SUI</text>
  <rect x="204" y="494" width="148" height="46" rx="6" fill="#17222a" stroke="#263641" stroke-width="1.5"/>
  <text x="278" y="522.5" text-anchor="middle" font-family="Be Vietnam Pro, sans-serif" font-size="15" font-weight="500" fill="#f1f5f8">Hedera</text>
  <rect x="364" y="494" width="148" height="46" rx="6" fill="#17222a" stroke="#263641" stroke-width="1.5"/>
  <text x="438" y="522.5" text-anchor="middle" font-family="Be Vietnam Pro, sans-serif" font-size="15" font-weight="500" fill="#f1f5f8">Aptos</text>
  <line x1="44" y1="564" x2="512" y2="564" stroke="#223039" stroke-width="1"/>
  <rect x="44" y="584" width="468" height="84" rx="6" fill="#17222a" stroke="#263641" stroke-width="1.5"/>
  <text x="64" y="619" font-family="Be Vietnam Pro, sans-serif" font-size="17" font-weight="600" fill="#f1f5f8">Permissioned networks</text>
  <text x="64" y="643" font-family="Be Vietnam Pro, sans-serif" font-size="15" fill="#c2ced6">by engagement with Quant</text>

  <!-- Fusion Rollup -->
  <rect x="560" y="344" width="380" height="348" rx="6" fill="#0c1317" stroke="#223039" stroke-width="1.5"/>
  <rect x="580" y="364" width="340" height="74" rx="6" fill="#17222a" stroke="#263641" stroke-width="1.5"/>
  <text x="600" y="397" font-family="Be Vietnam Pro, sans-serif" font-size="19" font-weight="700" fill="#f1f5f8">Fusion Rollup</text>
  <text x="600" y="421" font-family="Be Vietnam Pro, sans-serif" font-size="15" fill="#c2ced6">a separate layer, via the Gateway</text>
  <path d="M604 438 V591 H628" fill="none" stroke="#8fa1ad" stroke-width="1.5"/>
  <text x="628" y="463" font-family="JetBrains Mono, monospace" font-size="15" letter-spacing="1" fill="#8fa1ad">CONNECTED AT TESTNET LAUNCH</text>
  <path d="M604 495 H628" fill="none" stroke="#8fa1ad" stroke-width="1.5"/>
  <rect x="628" y="476" width="292" height="38" rx="6" fill="#17222a" stroke="#263641" stroke-width="1.5"/>
  <text x="646" y="500.5" font-family="Be Vietnam Pro, sans-serif" font-size="15" font-weight="500" fill="#f1f5f8">Ethereum Sepolia</text>
  <path d="M604 543 H628" fill="none" stroke="#8fa1ad" stroke-width="1.5"/>
  <rect x="628" y="524" width="292" height="38" rx="6" fill="#17222a" stroke="#263641" stroke-width="1.5"/>
  <text x="646" y="548.5" font-family="Be Vietnam Pro, sans-serif" font-size="15" font-weight="500" fill="#f1f5f8">Polygon Amoy</text>
  <rect x="628" y="572" width="292" height="38" rx="6" fill="#17222a" stroke="#263641" stroke-width="1.5"/>
  <text x="646" y="596.5" font-family="Be Vietnam Pro, sans-serif" font-size="15" font-weight="500" fill="#f1f5f8">Quant permissioned Besu testnet</text>
  <rect x="628" y="630" width="292" height="38" rx="6" fill="none" stroke="#8fa1ad" stroke-width="1.5" stroke-dasharray="5 4"/>
  <path d="M646 643 L658 655 M658 643 L646 655" fill="none" stroke="#EF5350" stroke-width="1.75" stroke-linecap="round"/>
  <text x="670" y="654.5" font-family="Be Vietnam Pro, sans-serif" font-size="15" font-weight="500" fill="#8fa1ad">Redbelly: not in launch list</text>
  <!-- the Gateway is the way in to the Fusion Rollup -->
  <circle cx="750" cy="316" r="3" fill="#8fa1ad"/>
  <line x1="750" y1="316" x2="750" y2="361" stroke="#8fa1ad" stroke-width="1.5" marker-end="url(#stack-w-arrow)"/>
</svg>
