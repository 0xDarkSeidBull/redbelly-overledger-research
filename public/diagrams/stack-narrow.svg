<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 1150" role="img" aria-labelledby="stack-n-title stack-n-desc">
  <title id="stack-n-title">Overledger in one picture</title>
  <desc id="stack-n-desc">An institution or app uses one login and one interface to reach the Overledger Gateway, which holds Flow Apps, a Firewall and Connectors, and Connectors reach the self-serve families and permissioned networks. The Gateway is also the way in to the Fusion Rollup, a separate layer connected at testnet launch to Ethereum Sepolia, Polygon Amoy and the Quant permissioned Besu testnet, while Redbelly is not in that documented launch list.</desc>
  <defs>
    <marker id="stack-n-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8fa1ad"/>
    </marker>
  </defs>

  <!-- Institution or app -->
  <rect x="40" y="16" width="320" height="72" rx="6" fill="#17222a" stroke="#263641" stroke-width="1.5"/>
  <text x="200" y="46" text-anchor="middle" font-family="Be Vietnam Pro, sans-serif" font-size="17" font-weight="700" fill="#f1f5f8">Institution or app</text>
  <text x="200" y="70" text-anchor="middle" font-family="Be Vietnam Pro, sans-serif" font-size="14" fill="#c2ced6">uses one login and one interface</text>
  <circle cx="200" cy="88" r="3" fill="#8fa1ad"/>
  <line x1="200" y1="88" x2="200" y2="125" stroke="#8fa1ad" stroke-width="1.5" marker-end="url(#stack-n-arrow)"/>

  <!-- Overledger Gateway -->
  <rect x="16" y="128" width="368" height="278" rx="6" fill="#1d3140" stroke="#EF5350" stroke-width="2"/>
  <text x="34" y="160" font-family="Be Vietnam Pro, sans-serif" font-size="17" font-weight="700" fill="#ffb3ae">Overledger Gateway</text>
  <rect x="32" y="178" width="336" height="64" rx="6" fill="#17222a" stroke="#263641" stroke-width="1.5"/>
  <text x="48" y="205" font-family="Be Vietnam Pro, sans-serif" font-size="16" font-weight="600" fill="#f1f5f8">Flow Apps</text>
  <text x="48" y="227" font-family="Be Vietnam Pro, sans-serif" font-size="14" fill="#c2ced6">multi-step workflows</text>
  <rect x="32" y="252" width="336" height="64" rx="6" fill="#17222a" stroke="#263641" stroke-width="1.5"/>
  <text x="48" y="279" font-family="Be Vietnam Pro, sans-serif" font-size="16" font-weight="600" fill="#f1f5f8">Firewall</text>
  <text x="48" y="301" font-family="Be Vietnam Pro, sans-serif" font-size="14" fill="#c2ced6">who may do what</text>
  <rect x="32" y="326" width="336" height="64" rx="6" fill="#17222a" stroke="#263641" stroke-width="1.5"/>
  <text x="48" y="353" font-family="Be Vietnam Pro, sans-serif" font-size="16" font-weight="600" fill="#f1f5f8">Connectors</text>
  <text x="48" y="375" font-family="Be Vietnam Pro, sans-serif" font-size="14" fill="#c2ced6">one interface to each chain family</text>
  <circle cx="200" cy="390" r="3" fill="#8fa1ad"/>
  <line x1="200" y1="390" x2="200" y2="439" stroke="#8fa1ad" stroke-width="1.5" marker-end="url(#stack-n-arrow)"/>

  <!-- Reached through Connectors -->
  <rect x="16" y="442" width="368" height="340" rx="6" fill="#0c1317" stroke="#223039" stroke-width="1.5"/>
  <rect x="32" y="465" width="18" height="4" rx="2" fill="#EF5350"/>
  <text x="58" y="472" font-family="JetBrains Mono, monospace" font-size="14" font-weight="500" letter-spacing="1.5" fill="#8fa1ad">REACHED THROUGH CONNECTORS</text>
  <text x="32" y="504" font-family="Be Vietnam Pro, sans-serif" font-size="14" font-weight="600" fill="#c2ced6">Self-serve families</text>
  <rect x="32" y="518" width="163" height="40" rx="6" fill="#17222a" stroke="#263641" stroke-width="1.5"/>
  <text x="113.5" y="543" text-anchor="middle" font-family="Be Vietnam Pro, sans-serif" font-size="14" font-weight="500" fill="#f1f5f8">EVM chains</text>
  <rect x="205" y="518" width="163" height="40" rx="6" fill="#17222a" stroke="#263641" stroke-width="1.5"/>
  <text x="286.5" y="543" text-anchor="middle" font-family="Be Vietnam Pro, sans-serif" font-size="14" font-weight="500" fill="#f1f5f8">Solana</text>
  <rect x="32" y="568" width="163" height="40" rx="6" fill="#17222a" stroke="#263641" stroke-width="1.5"/>
  <text x="113.5" y="593" text-anchor="middle" font-family="Be Vietnam Pro, sans-serif" font-size="14" font-weight="500" fill="#f1f5f8">Cosmos</text>
  <rect x="205" y="568" width="163" height="40" rx="6" fill="#17222a" stroke="#263641" stroke-width="1.5"/>
  <text x="286.5" y="593" text-anchor="middle" font-family="Be Vietnam Pro, sans-serif" font-size="14" font-weight="500" fill="#f1f5f8">SUI</text>
  <rect x="32" y="618" width="163" height="40" rx="6" fill="#17222a" stroke="#263641" stroke-width="1.5"/>
  <text x="113.5" y="643" text-anchor="middle" font-family="Be Vietnam Pro, sans-serif" font-size="14" font-weight="500" fill="#f1f5f8">Hedera</text>
  <rect x="205" y="618" width="163" height="40" rx="6" fill="#17222a" stroke="#263641" stroke-width="1.5"/>
  <text x="286.5" y="643" text-anchor="middle" font-family="Be Vietnam Pro, sans-serif" font-size="14" font-weight="500" fill="#f1f5f8">Aptos</text>
  <line x1="32" y1="678" x2="368" y2="678" stroke="#223039" stroke-width="1"/>
  <rect x="32" y="694" width="336" height="72" rx="6" fill="#17222a" stroke="#263641" stroke-width="1.5"/>
  <text x="48" y="724" font-family="Be Vietnam Pro, sans-serif" font-size="16" font-weight="600" fill="#f1f5f8">Permissioned networks</text>
  <text x="48" y="748" font-family="Be Vietnam Pro, sans-serif" font-size="14" fill="#c2ced6">by engagement with Quant</text>

  <!-- Fusion Rollup -->
  <rect x="16" y="802" width="368" height="332" rx="6" fill="#0c1317" stroke="#223039" stroke-width="1.5"/>
  <rect x="32" y="818" width="336" height="72" rx="6" fill="#17222a" stroke="#263641" stroke-width="1.5"/>
  <text x="48" y="848" font-family="Be Vietnam Pro, sans-serif" font-size="17" font-weight="700" fill="#f1f5f8">Fusion Rollup</text>
  <text x="48" y="872" font-family="Be Vietnam Pro, sans-serif" font-size="14" fill="#c2ced6">a separate layer, via the Gateway</text>
  <path d="M52 890 V1043 H72" fill="none" stroke="#8fa1ad" stroke-width="1.5"/>
  <text x="72" y="916" font-family="JetBrains Mono, monospace" font-size="14" letter-spacing="1" fill="#8fa1ad">CONNECTED AT TESTNET LAUNCH</text>
  <path d="M52 947 H72" fill="none" stroke="#8fa1ad" stroke-width="1.5"/>
  <rect x="72" y="928" width="296" height="38" rx="6" fill="#17222a" stroke="#263641" stroke-width="1.5"/>
  <text x="88" y="952" font-family="Be Vietnam Pro, sans-serif" font-size="14" font-weight="500" fill="#f1f5f8">Ethereum Sepolia</text>
  <path d="M52 995 H72" fill="none" stroke="#8fa1ad" stroke-width="1.5"/>
  <rect x="72" y="976" width="296" height="38" rx="6" fill="#17222a" stroke="#263641" stroke-width="1.5"/>
  <text x="88" y="1000" font-family="Be Vietnam Pro, sans-serif" font-size="14" font-weight="500" fill="#f1f5f8">Polygon Amoy</text>
  <rect x="72" y="1024" width="296" height="38" rx="6" fill="#17222a" stroke="#263641" stroke-width="1.5"/>
  <text x="88" y="1048" font-family="Be Vietnam Pro, sans-serif" font-size="14" font-weight="500" fill="#f1f5f8">Quant permissioned Besu testnet</text>
  <rect x="72" y="1080" width="296" height="38" rx="6" fill="none" stroke="#8fa1ad" stroke-width="1.5" stroke-dasharray="5 4"/>
  <path d="M89 1093.5 L100 1104.5 M100 1093.5 L89 1104.5" fill="none" stroke="#EF5350" stroke-width="1.75" stroke-linecap="round"/>
  <text x="112" y="1104" font-family="Be Vietnam Pro, sans-serif" font-size="14" font-weight="500" fill="#8fa1ad">Redbelly: not in launch list</text>
</svg>
