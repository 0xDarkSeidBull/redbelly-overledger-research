<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 624" role="img" aria-labelledby="breaks-w-title breaks-w-desc">
<title id="breaks-w-title">Where compliance could break</title>
<desc id="breaks-w-desc">Three columns show an asset on Redbelly, a bridge that locks it and issues a copy on the other chain, and the copy on another chain, with seven numbered red markers where compliance could break. A legend of the seven break points sits below, marked as analysis.</desc>
