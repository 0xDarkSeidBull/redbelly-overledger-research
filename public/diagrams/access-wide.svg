<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 614" role="img" aria-labelledby="access-w-title access-w-desc">
  <title id="access-w-title">Reading Redbelly is open, writing needs an access credential</title>
  <desc id="access-w-desc">Reading goes through a public RPC that answered with chain ID 151, while net_version is not supported. Writing runs from a wallet through an accredited issuer and an access credential to write access, and three bridge routes are listed by Redbelly.</desc>
  <defs>
    <marker id="access-w-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8fa1ad"/>
    </marker>
  </defs>
  <rect x="20" y="16" width="920" height="206" rx="6" fill="#0c1317" stroke="#223039" stroke-width="1.5"/>
  <rect x="44" y="46" width="18" height="4" rx="2" fill="#EF5350"/>
  <text x="70" y="54" font-family="JetBrains Mono, monospace" font-size="15" font-weight="500" letter-spacing="1.5" fill="#8fa1ad">READ</text>
  <rect x="128" y="36" width="112" height="26" rx="13" fill="#86EFAC"/>
  <circle cx="146.6" cy="49.0" r="3.4" fill="#0c1317"/>
  <text x="162" y="54" font-family="JetBrains Mono, monospace" font-size="15" font-weight="500" letter-spacing="1.2" fill="#0c1317">TESTED</text>
  <rect x="44" y="82" width="360" height="116" rx="6" fill="#17222a" stroke="#263641" stroke-width="1.5"/>
  <text x="64" y="120" font-family="Be Vietnam Pro, sans-serif" font-size="19" font-weight="700" fill="#f1f5f8">Public RPC</text>
  <circle cx="66" cy="145" r="2.5" fill="#8fa1ad"/>
  <text x="76" y="150" font-family="JetBrains Mono, monospace" font-size="15" fill="#c2ced6">governors.mainnet.redbelly.network</text>
  <circle cx="66" cy="169" r="2.5" fill="#8fa1ad"/>
  <text x="76" y="174" font-family="JetBrains Mono, monospace" font-size="15" fill="#c2ced6">rpc.ankr.com/redbelly_mainnet</text>
  <circle cx="404" cy="140" r="3" fill="#8fa1ad"/>
  <line x1="404" y1="140" x2="442" y2="140" stroke="#8fa1ad" stroke-width="1.5" marker-end="url(#access-w-arrow)"/>
  <rect x="444" y="82" width="276" height="116" rx="6" fill="#17222a" stroke="#263641" stroke-width="1.5"/>
  <circle cx="478" cy="140" r="14" fill="none" stroke="#86EFAC" stroke-width="1.5"/>
  <path d="M471.5 140.5 l4.5 4.5 l8.5 -9" fill="none" stroke="#86EFAC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="506" y="135" font-family="Be Vietnam Pro, sans-serif" font-size="19" font-weight="700" fill="#f1f5f8">Chain ID <tspan font-family="JetBrains Mono, monospace" font-weight="500">151</tspan></text>
  <text x="506" y="160" font-family="Be Vietnam Pro, sans-serif" font-size="15" fill="#c2ced6">answered on 15 Oct 2026</text>
  <rect x="744" y="100" width="172" height="80" rx="6" fill="none" stroke="#8fa1ad" stroke-width="1.5" stroke-dasharray="5 4"/>
  <path d="M764 123 l11 11 m0 -11 l-11 11" fill="none" stroke="#EF5350" stroke-width="1.75" stroke-linecap="round"/>
  <text x="786" y="134" font-family="JetBrains Mono, monospace" font-size="15" font-weight="500" fill="#c2ced6">net_version</text>
  <text x="786" y="159" font-family="Be Vietnam Pro, sans-serif" font-size="15" fill="#8fa1ad">not supported</text>
  <rect x="20" y="238" width="920" height="206" rx="6" fill="#0c1317" stroke="#223039" stroke-width="1.5"/>
  <rect x="44" y="268" width="18" height="4" rx="2" fill="#EF5350"/>
  <text x="70" y="276" font-family="JetBrains Mono, monospace" font-size="15" font-weight="500" letter-spacing="1.5" fill="#8fa1ad">WRITE</text>
  <rect x="139" y="258" width="142" height="26" rx="13" fill="none" stroke="#86EFAC" stroke-width="1.5"/>
  <circle cx="157.6" cy="271.0" r="3.4" fill="#86EFAC"/>
  <text x="173" y="276" font-family="JetBrains Mono, monospace" font-size="15" font-weight="500" letter-spacing="1.2" fill="#86EFAC">CONFIRMED</text>
  <rect x="44" y="334" width="96" height="56" rx="6" fill="#17222a" stroke="#263641" stroke-width="1.5"/>
  <text x="92" y="368" text-anchor="middle" font-family="Be Vietnam Pro, sans-serif" font-size="17" font-weight="600" fill="#f1f5f8">Wallet</text>
  <circle cx="140" cy="362" r="3" fill="#8fa1ad"/>
  <line x1="140" y1="362" x2="178" y2="362" stroke="#8fa1ad" stroke-width="1.5" marker-end="url(#access-w-arrow)"/>
  <rect x="180" y="304" width="206" height="116" rx="6" fill="#17222a" stroke="#263641" stroke-width="1.5"/>
  <text x="198" y="342" font-family="Be Vietnam Pro, sans-serif" font-size="18" font-weight="700" fill="#f1f5f8">Accredited issuer</text>
  <text font-family="Be Vietnam Pro, sans-serif" font-size="15" fill="#c2ced6"><tspan x="198" y="370">listed in an</tspan><tspan x="198" dy="21">on-chain registry</tspan></text>
  <circle cx="386" cy="362" r="3" fill="#8fa1ad"/>
  <line x1="386" y1="362" x2="424" y2="362" stroke="#8fa1ad" stroke-width="1.5" marker-end="url(#access-w-arrow)"/>
  <rect x="426" y="304" width="206" height="116" rx="6" fill="#17222a" stroke="#263641" stroke-width="1.5"/>
  <text x="444" y="342" font-family="Be Vietnam Pro, sans-serif" font-size="18" font-weight="700" fill="#f1f5f8">Access credential</text>
  <text font-family="Be Vietnam Pro, sans-serif" font-size="15" fill="#c2ced6"><tspan x="444" y="370">claimed by the user</tspan></text>
  <circle cx="632" cy="362" r="3" fill="#8fa1ad"/>
  <line x1="632" y1="362" x2="670" y2="362" stroke="#8fa1ad" stroke-width="1.5" marker-end="url(#access-w-arrow)"/>
  <rect x="672" y="304" width="244" height="116" rx="6" fill="#1d3140" stroke="#EF5350" stroke-width="2"/>
  <text x="690" y="342" font-family="Be Vietnam Pro, sans-serif" font-size="18" font-weight="700" fill="#ffb3ae">Write access</text>
  <text font-family="Be Vietnam Pro, sans-serif" font-size="15" fill="#c2ced6"><tspan x="690" y="370">account self-enables it</tspan><tspan x="690" dy="21">through a network contract</tspan></text>
  <rect x="20" y="460" width="920" height="138" rx="6" fill="#0c1317" stroke="#223039" stroke-width="1.5"/>
  <rect x="44" y="490" width="18" height="4" rx="2" fill="#EF5350"/>
  <text x="70" y="498" font-family="JetBrains Mono, monospace" font-size="15" font-weight="500" letter-spacing="1.5" fill="#8fa1ad">BRIDGE ROUTES LISTED BY REDBELLY</text>
  <rect x="44" y="526" width="280" height="48" rx="6" fill="#17222a" stroke="#263641" stroke-width="1.5"/>
  <circle cx="66" cy="550" r="3.5" fill="none" stroke="#EF5350" stroke-width="1.5"/>
  <line x1="69.5" y1="550" x2="82.5" y2="550" stroke="#EF5350" stroke-width="1.5"/>
  <circle cx="86" cy="550" r="3.5" fill="none" stroke="#EF5350" stroke-width="1.5"/>
  <text x="102" y="555.5" font-family="Be Vietnam Pro, sans-serif" font-size="16" font-weight="500" fill="#f1f5f8">Celer cBridge</text>
  <rect x="340" y="526" width="280" height="48" rx="6" fill="#17222a" stroke="#263641" stroke-width="1.5"/>
  <circle cx="362" cy="550" r="3.5" fill="none" stroke="#EF5350" stroke-width="1.5"/>
  <line x1="365.5" y1="550" x2="378.5" y2="550" stroke="#EF5350" stroke-width="1.5"/>
  <circle cx="382" cy="550" r="3.5" fill="none" stroke="#EF5350" stroke-width="1.5"/>
  <text x="398" y="555.5" font-family="Be Vietnam Pro, sans-serif" font-size="16" font-weight="500" fill="#f1f5f8">LayerZero with Stargate</text>
  <rect x="636" y="526" width="280" height="48" rx="6" fill="#17222a" stroke="#263641" stroke-width="1.5"/>
  <circle cx="658" cy="550" r="3.5" fill="none" stroke="#EF5350" stroke-width="1.5"/>
  <line x1="661.5" y1="550" x2="674.5" y2="550" stroke="#EF5350" stroke-width="1.5"/>
  <circle cx="678" cy="550" r="3.5" fill="none" stroke="#EF5350" stroke-width="1.5"/>
  <text x="694" y="555.5" font-family="Be Vietnam Pro, sans-serif" font-size="16" font-weight="500" fill="#f1f5f8">Lucid Labs</text>
</svg>
