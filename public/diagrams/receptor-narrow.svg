<text font-family="Be Vietnam Pro, sans-serif" font-size="14" fill="#8fa1ad"><tspan x="64" y="849">The access credential unlocks write</tspan><tspan x="64" dy="20">access on Redbelly. <tspan font-weight="500" fill="#c2ced6">No source shows</tspan></tspan><tspan x="64" dy="20" font-weight="500" fill="#c2ced6">another chain reading it.</tspan></text>
