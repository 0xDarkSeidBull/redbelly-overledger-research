<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 920" role="img" aria-labelledby="receptor-n-title receptor-n-desc">
<title id="receptor-n-title">Which Receptor checks could work off Redbelly</title>
<desc id="receptor-n-desc">A Receptor credential, a W3C verifiable credential held by the user, splits into two methods. Proof by Query is checked by a verifier smart contract against identity state published on Redbelly, so another chain only works if the setup is rebuilt there; Selective Disclosure is checked off-chain against the issuer's BBS+ signature, so it could be checked anywhere in principle, but the Overledger app catalogue is not public. The access credential unlocks write access on Redbelly, and no source shows another chain reading it.</desc>
