<text x="122" y="146" font-family="Be Vietnam Pro, sans-serif" font-size="17" font-weight="700" fill="#f1f5f8">Proof by Query</text>
<text x="122" y="167" font-family="Be Vietnam Pro, sans-serif" font-size="14" fill="#c2ced6">zero knowledge proof</text>
