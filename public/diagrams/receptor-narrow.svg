<text x="68" y="214" font-family="JetBrains Mono, monospace" font-size="14" font-weight="500" letter-spacing="1.5" fill="#8fa1ad">CHECKED BY</text>
<text x="68" y="236" font-family="Be Vietnam Pro, sans-serif" font-size="15" font-weight="500" fill="#f1f5f8">a verifier smart contract</text>
