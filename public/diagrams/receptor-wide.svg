<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 660" role="img" aria-labelledby="receptor-w-title receptor-w-desc">
<title id="receptor-w-title">Which Receptor checks could work off Redbelly</title>
<desc id="receptor-w-desc">A Receptor credential, a W3C verifiable credential held by the user, splits into two methods. Proof by Query is checked by a verifier smart contract against identity state published on Redbelly, so another chain only works if the setup is rebuilt there; Selective Disclosure is checked off-chain against the issuer's BBS+ signature, so it could be checked anywhere in principle, but we found no Overledger app that does it.</desc>
<defs>
<marker id="receptor-w-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8fa1ad"/></marker>
</defs>
<rect x="260" y="10" width="440" height="92" rx="6" fill="#17222a" stroke="#263641" stroke-width="1.5"/>
<rect x="282" y="32" width="48" height="48" rx="8" fill="#1d3140"/>
<g transform="translate(292 42) scale(1.16667)" fill="none" stroke="#ffb3ae" stroke-width="1.54" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2.5"/><circle cx="8.5" cy="11" r="2"/><path d="M6 15.5h5M13.5 10h4.5M13.5 13.5h3"/></g>
<text x="348" y="52" font-family="Be Vietnam Pro, sans-serif" font-size="20" font-weight="700" fill="#f1f5f8">Receptor credential</text>
<text x="348" y="78" font-family="Be Vietnam Pro, sans-serif" font-size="16" fill="#c2ced6">W3C verifiable credential held by the user</text>
<circle cx="480" cy="102" r="3" fill="#8fa1ad"/>
<path d="M480 102 V120" fill="none" stroke="#8fa1ad" stroke-width="1.5"/>
<path d="M480 120 Q480 132 468 132 H252 Q240 132 240 144 V164" fill="none" stroke="#8fa1ad" stroke-width="1.5" marker-end="url(#receptor-w-arrow)"/>
<path d="M480 120 Q480 132 492 132 H708 Q720 132 720 144 V164" fill="none" stroke="#8fa1ad" stroke-width="1.5" marker-end="url(#receptor-w-arrow)"/>
<rect x="20" y="166" width="440" height="400" rx="6" fill="#17222a" stroke="#263641" stroke-width="1.5"/>
<rect x="42" y="188" width="48" height="48" rx="8" fill="#1d3140"/>
<g transform="translate(52 198) scale(1.16667)" fill="none" stroke="#ffb3ae" stroke-width="1.54" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7.5 3v5.2c0 4.6-3.2 8.4-7.5 9.8-4.3-1.4-7.5-5.2-7.5-9.8V6z"/><circle cx="12" cy="10.6" r="1.9"/><path d="M12 12.5v3.2"/></g>
<text x="108" y="208" font-family="Be Vietnam Pro, sans-serif" font-size="20" font-weight="700" fill="#f1f5f8">Proof by Query</text>
<text x="108" y="233" font-family="Be Vietnam Pro, sans-serif" font-size="16" fill="#c2ced6">zero knowledge proof</text>
<line x1="42" y1="258" x2="438" y2="258" stroke="#263641" stroke-width="1"/>
<text x="42" y="290" font-family="JetBrains Mono, monospace" font-size="15" font-weight="500" letter-spacing="1.5" fill="#8fa1ad">CHECKED BY</text>
<text x="42" y="316" font-family="Be Vietnam Pro, sans-serif" font-size="17" font-weight="500" fill="#f1f5f8">a verifier smart contract</text>
<line x1="42" y1="338" x2="438" y2="338" stroke="#263641" stroke-width="1"/>
<text x="42" y="370" font-family="JetBrains Mono, monospace" font-size="15" font-weight="500" letter-spacing="1.5" fill="#8fa1ad">RELIES ON</text>
<text x="42" y="396" font-family="Be Vietnam Pro, sans-serif" font-size="17" font-weight="500" fill="#f1f5f8">identity state published on Redbelly</text>
<rect x="42" y="424" width="396" height="120" rx="6" fill="#1d3140" stroke="#EF5350" stroke-width="2"/>
<rect x="60" y="442" width="125.6" height="26" rx="13" fill="none" stroke="#FCD34D" stroke-width="1.5"/>
<circle cx="78.0" cy="455.0" r="3.4" fill="#FCD34D"/>
<text x="92" y="460.4" font-family="JetBrains Mono, monospace" font-size="15" font-weight="500" letter-spacing="1.2" fill="#FCD34D">ANALYSIS</text>
<text font-family="Be Vietnam Pro, sans-serif" fill="#f1f5f8"><tspan x="60" y="496" font-size="17" font-weight="700" fill="#ffb3ae">Another chain:</tspan><tspan x="60" dy="24" font-size="16" fill="#c2ced6">only if the setup is rebuilt there</tspan></text>
<rect x="500" y="166" width="440" height="400" rx="6" fill="#17222a" stroke="#263641" stroke-width="1.5"/>
