<text x="588" y="208" font-family="Be Vietnam Pro, sans-serif" font-size="20" font-weight="700" fill="#f1f5f8">Selective Disclosure</text>
<text x="588" y="233" font-family="Be Vietnam Pro, sans-serif" font-size="16" fill="#c2ced6">reveals chosen details</text>
<line x1="522" y1="258" x2="918" y2="258" stroke="#263641" stroke-width="1"/>
<text x="522" y="290" font-family="JetBrains Mono, monospace" font-size="15" font-weight="500" letter-spacing="1.5" fill="#8fa1ad">CHECKED BY</text>
<text x="522" y="316" font-family="Be Vietnam Pro, sans-serif" font-size="17" font-weight="500" fill="#f1f5f8">a verifier, off-chain only</text>
<line x1="522" y1="338" x2="918" y2="338" stroke="#263641" stroke-width="1"/>
<text x="522" y="370" font-family="JetBrains Mono, monospace" font-size="15" font-weight="500" letter-spacing="1.5" fill="#8fa1ad">RELIES ON</text>
<text x="522" y="396" font-family="Be Vietnam Pro, sans-serif" font-size="17" font-weight="500" fill="#f1f5f8">the issuer&apos;s BBS+ signature</text>
<rect x="522" y="424" width="396" height="120" rx="6" fill="#141f26" stroke="#FCD34D" stroke-width="1.5"/>
<rect x="540" y="442" width="125.6" height="26" rx="13" fill="none" stroke="#FCD34D" stroke-width="1.5"/>
<circle cx="558.0" cy="455.0" r="3.4" fill="#FCD34D"/>
<text x="572" y="460.4" font-family="JetBrains Mono, monospace" font-size="15" font-weight="500" letter-spacing="1.2" fill="#FCD34D">ANALYSIS</text>
<text font-family="Be Vietnam Pro, sans-serif" fill="#f1f5f8"><tspan x="540" y="496" font-size="16" font-weight="600" fill="#f1f5f8">Could be checked anywhere in principle,</tspan><tspan x="540" dy="24" font-size="16" fill="#c2ced6">no such Overledger app foundday</tspan></text>
<rect x="20" y="590" width="920" height="60" rx="6" fill="#0c1317" stroke="#223039" stroke-width="1.5"/>
<g transform="translate(181.5 609) scale(0.916667)" fill="none" stroke="#EF5350" stroke-width="1.96" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="10.5" width="14" height="10" rx="2"/><path d="M8.5 10.5V7.8a3.5 3.5 0 0 1 7 0v2.7M12 14.5v2.2"/></g>
<text x="217.5" y="625.5" font-family="Be Vietnam Pro, sans-serif" font-size="16" fill="#8fa1ad">The access credential that unlocks write access works <tspan font-weight="500" fill="#c2ced6">only on Redbelly.</tspan></text>
</svg>
