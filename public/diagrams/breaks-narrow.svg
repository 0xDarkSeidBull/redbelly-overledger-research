<text font-family="Be Vietnam Pro, sans-serif" font-size="14" font-weight="400" fill="#c2ced6"><tspan x="71" y="145.0">Identity, eligibility and limits</tspan><tspan x="71" dy="19">checked at every transfer</tspan></text>
<rect x="32" y="187.0" width="336" height="40" rx="6" fill="#17222a" stroke="#263641" stroke-width="1"/>
