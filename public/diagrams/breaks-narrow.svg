<text x="36" y="1007.9" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="14" font-weight="500" fill="#ffffff">5</text>
<text font-family="Be Vietnam Pro, sans-serif" font-size="14" font-weight="400" fill="#c2ced6"><tspan x="58" y="1008.0">Token list set by Quant governance</tspan></text>
<circle cx="36" cy="1039.0" r="11" fill="#EF5350"/>
<text x="36" y="1043.9" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="14" font-weight="500" fill="#ffffff">6</text>
<text font-family="Be Vietnam Pro, sans-serif" font-size="14" font-weight="400" fill="#c2ced6"><tspan x="58" y="1044.0">Register must show units held elsewhere</tspan></text>
<circle cx="36" cy="1075.0" r="11" fill="#EF5350"/>
<text x="36" y="1079.9" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="14" font-weight="500" fill="#ffffff">7</text>
<text font-family="Be Vietnam Pro, sans-serif" font-size="14" font-weight="400" fill="#c2ced6"><tspan x="58" y="1080.0">Dispute window instead of</tspan><tspan x="58" dy="19">single round settlement</tspan></text>
