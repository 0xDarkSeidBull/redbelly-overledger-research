<text x="199" y="817" font-family="JetBrains Mono, monospace" font-size="14" font-weight="500" letter-spacing="1.2" fill="#FCD34D">ANALYSIS</text>
<circle cx="36" cy="859.0" r="11" fill="#EF5350"/>
<text x="36" y="863.9" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="14" font-weight="500" fill="#ffffff">1</text>
<text font-family="Be Vietnam Pro, sans-serif" font-size="14" font-weight="400" fill="#c2ced6"><tspan x="58" y="864.0">Copy without eligibility checks</tspan></text>
