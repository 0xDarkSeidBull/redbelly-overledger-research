<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 1130" role="img" aria-labelledby="breaks-n-title breaks-n-desc">
<title id="breaks-n-title">Where compliance could break</title>
<desc id="breaks-n-desc">Three stacked boxes show an asset on Redbelly, a bridge that locks it and issues a copy on the other chain, and the copy on another chain, with seven numbered red markers where compliance could break. A legend of the seven break points sits below, marked as analysis.</desc>
<defs>
<marker id="breaks-n-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8fa1ad"/></marker>
</defs>
<rect x="8" y="8" width="384" height="759" rx="6" fill="#0c1317" stroke="#223039" stroke-width="1.5"/>
<rect x="20" y="22.0" width="360" height="265" rx="6" fill="#1d3140" stroke="#EF5350" stroke-width="2"/>
<text x="36" y="54.0" font-family="Be Vietnam Pro, sans-serif" font-size="17" font-weight="700" fill="#ffb3ae">On Redbelly</text>
<rect x="32" y="72.0" width="336" height="40" rx="6" fill="#17222a" stroke="#263641" stroke-width="1"/>
<g transform="translate(44 83.5) scale(0.7083)" fill="none" stroke="#8fa1ad" stroke-width="2.12" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.8l8 4.6v9.2l-8 4.6-8-4.6V7.4z"/><circle cx="12" cy="12" r="3.4"/></g>
<text font-family="Be Vietnam Pro, sans-serif" font-size="14" font-weight="400" fill="#c2ced6"><tspan x="71" y="97.0">Tokeniser asset</tspan></text>
