<circle cx="36" cy="931.0" r="11" fill="#EF5350"/>
<text x="36" y="935.9" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="14" font-weight="500" fill="#ffffff">3</text>
<text font-family="Be Vietnam Pro, sans-serif" font-size="14" font-weight="400" fill="#c2ced6"><tspan x="58" y="936.0">Revocation does not reach the copy</tspan></text>
