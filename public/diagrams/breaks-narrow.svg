<text font-family="Be Vietnam Pro, sans-serif" font-size="14" font-weight="400" fill="#c2ced6"><tspan x="71" y="639.9">The copy follows only</tspan><tspan x="71" dy="19">that chain's rules</tspan></text>
<circle cx="345" cy="644.5" r="11" fill="#EF5350"/>
<text x="345" y="649.4" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="14" font-weight="500" fill="#ffffff">1</text>
<rect x="32" y="682.0" width="336" height="59" rx="6" fill="#141f26" stroke="#263641" stroke-width="1"/>
<g transform="translate(44 703.0) scale(0.7083)" fill="none" stroke="#8fa1ad" stroke-width="2.12" stroke-linecap="round" stroke-linejoin="round"><path d="M3.6 7l2 2 3.4-3.6M3.6 15.6l2 2 3.4-3.6M12.4 7.6h8M12.4 16.2h8"/></g>
<text font-family="Be Vietnam Pro, sans-serif" font-size="14" font-weight="400" fill="#c2ced6"><tspan x="71" y="706.9">Overledger firewall uses</tspan><tspan x="71" dy="19">its own allowlists</tspan></text>
<circle cx="345" cy="711.5" r="11" fill="#EF5350"/>
<text x="345" y="716.4" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="14" font-weight="500" fill="#ffffff">2</text>
