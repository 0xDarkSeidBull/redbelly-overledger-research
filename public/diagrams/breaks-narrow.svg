<g transform="translate(44 460.5) scale(0.7083)" fill="none" stroke="#8fa1ad" stroke-width="2.12" stroke-linecap="round" stroke-linejoin="round"><rect x="8.6" y="8.6" width="12" height="12" rx="2.2"/><path d="M15.4 8.6V5.6a2.2 2.2 0 0 0-2.2-2.2H5.6a2.2 2.2 0 0 0-2.2 2.2v7.6a2.2 2.2 0 0 0 2.2 2.2h3"/></g>
