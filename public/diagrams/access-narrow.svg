<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 1120" role="img" aria-labelledby="access-n-title access-n-desc">
  <title id="access-n-title">Reading Redbelly is open, writing needs an access credential</title>
  <desc id="access-n-desc">Reading goes through a public RPC that answered with chain ID 151, while net_version is not supported. Writing runs from a wallet through an accredited issuer and an access credential to write access, and three bridge routes are listed by Redbelly.</desc>
  <defs>
    <marker id="access-n-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8fa1ad"/>
    </marker>
  </defs>
  <!-- Read -->
  <rect x="10" y="12" width="380" height="374" rx="6" fill="#0c1317" stroke="#223039" stroke-width="1.5"/>
  <rect x="26" y="40.5" width="18" height="4" rx="2" fill="#EF5350"/>
  <text x="52" y="48" font-family="JetBrains Mono, monospace" font-size="14" font-weight="500" letter-spacing="1.5" fill="#8fa1ad">READ</text>
  <rect x="106" y="31" width="102" height="24" rx="12" fill="#86EFAC"/>
  <circle cx="123.0" cy="43.0" r="3.4" fill="#0c1317"/>
  <text x="137" y="47.8" font-family="JetBrains Mono, monospace" font-size="14" font-weight="500" letter-spacing="1.1" fill="#0c1317">TESTED</text>
  <rect x="26" y="72" width="348" height="106" rx="6" fill="#17222a" stroke="#263641" stroke-width="1.5"/>
  <text x="42" y="105" font-family="Be Vietnam Pro, sans-serif" font-size="17" font-weight="700" fill="#f1f5f8">Public RPC</text>
  <circle cx="44" cy="128.5" r="2.5" fill="#8fa1ad"/>
  <text x="53" y="133" font-family="JetBrains Mono, monospace" font-size="14" fill="#c2ced6">governors.mainnet.redbelly.network</text>
  <circle cx="44" cy="151.5" r="2.5" fill="#8fa1ad"/>
  <text x="53" y="156" font-family="JetBrains Mono, monospace" font-size="14" fill="#c2ced6">rpc.ankr.com/redbelly_mainnet</text>
  <circle cx="200" cy="178" r="3" fill="#8fa1ad"/>
  <line x1="200" y1="178" x2="200" y2="206" stroke="#8fa1ad" stroke-width="1.5" marker-end="url(#access-n-arrow)"/>
  <rect x="26" y="208" width="348" height="76" rx="6" fill="#17222a" stroke="#263641" stroke-width="1.5"/>
  <circle cx="56" cy="246" r="14" fill="none" stroke="#86EFAC" stroke-width="1.5"/>
  <path d="M49.5 246.5 l4.5 4.5 l8.5 -9" fill="none" stroke="#86EFAC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="84" y="241" font-family="Be Vietnam Pro, sans-serif" font-size="17" font-weight="700" fill="#f1f5f8">Chain ID <tspan font-family="JetBrains Mono, monospace" font-weight="500">151</tspan></text>
  <text x="84" y="264" font-family="Be Vietnam Pro, sans-serif" font-size="14" fill="#c2ced6">answered on 15 Oct 2026</text>
  <rect x="26" y="298" width="348" height="68" rx="6" fill="none" stroke="#8fa1ad" stroke-width="1.5" stroke-dasharray="5 4"/>
  <path d="M50.5 317 l11 11 m0 -11 l-11 11" fill="none" stroke="#EF5350" stroke-width="1.75" stroke-linecap="round"/>
  <text x="84" y="328" font-family="JetBrains Mono, monospace" font-size="14" font-weight="500" fill="#c2ced6">net_version</text>
  <text x="84" y="350" font-family="Be Vietnam Pro, sans-serif" font-size="14" fill="#8fa1ad">not supported</text>

  <!-- Write -->
  <rect x="10" y="400" width="380" height="462" rx="6" fill="#0c1317" stroke="#223039" stroke-width="1.5"/>
  <rect x="26" y="428.5" width="18" height="4" rx="2" fill="#EF5350"/>
  <text x="52" y="436" font-family="JetBrains Mono, monospace" font-size="14" font-weight="500" letter-spacing="1.5" fill="#8fa1ad">WRITE</text>
  <rect x="116" y="419" width="130" height="24" rx="12" fill="none" stroke="#86EFAC" stroke-width="1.5"/>
  <circle cx="133.0" cy="431.0" r="3.4" fill="#86EFAC"/>
  <text x="147" y="435.8" font-family="JetBrains Mono, monospace" font-size="14" font-weight="500" letter-spacing="1.1" fill="#86EFAC">CONFIRMED</text>
  <rect x="134" y="460" width="132" height="44" rx="6" fill="#17222a" stroke="#263641" stroke-width="1.5"/>
  <text x="200" y="487.5" text-anchor="middle" font-family="Be Vietnam Pro, sans-serif" font-size="16" font-weight="600" fill="#f1f5f8">Wallet</text>
  <circle cx="200" cy="504" r="3" fill="#8fa1ad"/>
  <line x1="200" y1="504" x2="200" y2="532" stroke="#8fa1ad" stroke-width="1.5" marker-end="url(#access-n-arrow)"/>
  <rect x="26" y="534" width="348" height="76" rx="6" fill="#17222a" stroke="#263641" stroke-width="1.5"/>
  <text x="42" y="565" font-family="Be Vietnam Pro, sans-serif" font-size="17" font-weight="700" fill="#f1f5f8">Accredited issuer</text>
  <text font-family="Be Vietnam Pro, sans-serif" font-size="14" fill="#c2ced6"><tspan x="42" y="589">listed in an on-chain registry</tspan></text>
  <circle cx="200" cy="610" r="3" fill="#8fa1ad"/>
  <line x1="200" y1="610" x2="200" y2="638" stroke="#8fa1ad" stroke-width="1.5" marker-end="url(#access-n-arrow)"/>
  <rect x="26" y="640" width="348" height="76" rx="6" fill="#17222a" stroke="#263641" stroke-width="1.5"/>
  <text x="42" y="671" font-family="Be Vietnam Pro, sans-serif" font-size="17" font-weight="700" fill="#f1f5f8">Access credential</text>
  <text font-family="Be Vietnam Pro, sans-serif" font-size="14" fill="#c2ced6"><tspan x="42" y="695">claimed by the user</tspan></text>
  <circle cx="200" cy="716" r="3" fill="#8fa1ad"/>
  <line x1="200" y1="716" x2="200" y2="744" stroke="#8fa1ad" stroke-width="1.5" marker-end="url(#access-n-arrow)"/>
  <rect x="26" y="746" width="348" height="96" rx="6" fill="#1d3140" stroke="#EF5350" stroke-width="2"/>
  <text x="42" y="777" font-family="Be Vietnam Pro, sans-serif" font-size="17" font-weight="700" fill="#ffb3ae">Write access</text>
  <text font-family="Be Vietnam Pro, sans-serif" font-size="14" fill="#c2ced6"><tspan x="42" y="801">account self-enables it</tspan><tspan x="42" dy="19">through a network contract</tspan></text>

  <!-- Bridge routes -->
  <rect x="10" y="876" width="380" height="232" rx="6" fill="#0c1317" stroke="#223039" stroke-width="1.5"/>
  <rect x="26" y="904.5" width="18" height="4" rx="2" fill="#EF5350"/>
  <text x="52" y="912" font-family="JetBrains Mono, monospace" font-size="14" font-weight="500" letter-spacing="1.2" fill="#8fa1ad">BRIDGE ROUTES LISTED BY REDBELLY</text>
  <rect x="26" y="936" width="348" height="44" rx="6" fill="#17222a" stroke="#263641" stroke-width="1.5"/>
  <circle cx="46" cy="958" r="3.5" fill="none" stroke="#EF5350" stroke-width="1.5"/>
  <line x1="49.5" y1="958" x2="62.5" y2="958" stroke="#EF5350" stroke-width="1.5"/>
  <circle cx="66" cy="958" r="3.5" fill="none" stroke="#EF5350" stroke-width="1.5"/>
  <text x="82" y="963" font-family="Be Vietnam Pro, sans-serif" font-size="15" font-weight="500" fill="#f1f5f8">Celer cBridge</text>
  <rect x="26" y="990" width="348" height="44" rx="6" fill="#17222a" stroke="#263641" stroke-width="1.5"/>
  <circle cx="46" cy="1012" r="3.5" fill="none" stroke="#EF5350" stroke-width="1.5"/>
  <line x1="49.5" y1="1012" x2="62.5" y2="1012" stroke="#EF5350" stroke-width="1.5"/>
  <circle cx="66" cy="1012" r="3.5" fill="none" stroke="#EF5350" stroke-width="1.5"/>
  <text x="82" y="1017" font-family="Be Vietnam Pro, sans-serif" font-size="15" font-weight="500" fill="#f1f5f8">LayerZero with Stargate</text>
  <rect x="26" y="1044" width="348" height="44" rx="6" fill="#17222a" stroke="#263641" stroke-width="1.5"/>
  <circle cx="46" cy="1066" r="3.5" fill="none" stroke="#EF5350" stroke-width="1.5"/>
  <line x1="49.5" y1="1066" x2="62.5" y2="1066" stroke="#EF5350" stroke-width="1.5"/>
  <circle cx="66" cy="1066" r="3.5" fill="none" stroke="#EF5350" stroke-width="1.5"/>
  <text x="82" y="1071" font-family="Be Vietnam Pro, sans-serif" font-size="15" font-weight="500" fill="#f1f5f8">Lucid Labs</text>
</svg>
